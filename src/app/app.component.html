@if (isHealthChecking) {
  <div class="app-loading-overlay" role="status" aria-live="polite">
    <div class="loading-centre">
      <app-paw-spinner [diameter]="90"></app-paw-spinner>
    </div>
  </div>
}

@if (!isHealthChecking) {
  @if (isServerDown) {
    <div class="server-down-banner" role="status" aria-live="polite">
      Server is spinning up, please try again in a minute.
    </div>
  }

  @if (isLoggedIn) {
    <app-top-bar></app-top-bar>
  }
  <div
    class="app-body"
    [class.full-screen]="!isLoggedIn"
    [class.with-banner]="isServerDown">
    <router-outlet></router-outlet>
  </div>
}
